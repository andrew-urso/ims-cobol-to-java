export JAVA_HOME="Path to Java Home Directory"

IMS_JAVA="Path to folder containing IMSUDB.jar"
APP_DIR="Path to..."/java3164/demo

LIBPATH="${JAVA_HOME}"/lib/s390x/j9vm
LIBPATH="${LIBPATH}":"${JAVA_HOME}"/lib/s390x/default
LIBPATH="${LIBPATH}":"${JAVA_HOME}"/lib/s390x
LIBPATH="${LIBPATH}":"${JAVA_HOME}"/lib
LIBPATH="${LIBPATH}":"${IMS_JAVA}"/lib
LIBPATH="${LIBPATH}":"${APP_DIR}"
export LIBPATH

CLASSPATH="${JAVA_HOME}"/lib
CLASSPATH="${CLASSPATH}":"${JAVA_HOME}"/lib/ext
CLASSPATH="${CLASSPATH}":"${IMS_JAVA}"/imsudb.jar
CLASSPATH="${CLASSPATH}":"${APP_DIR}"
export CLASSPATH

IJO="-Xint"
IJO="$IJO -Xnocompressedrefs"
IJO="$IJO -Xmx256m"
IJO="$IJO -Xms16m"
IJO="$IJO -Xss1m"
export IBM_JAVA_OPTIONS="$IJO"

export JZOS_OUTPUT_ENCODING=Cp1047
export JZOS_ENABLE_OUTPUT_TRANSCODING=true
